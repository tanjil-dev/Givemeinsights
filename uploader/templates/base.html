{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    {% block title %}
    {% endblock %}
    <!-- Fav Icon -->
    <link rel="icon" href="{% static 'images/favicon-32x32.png' %}" type="image/x-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,300i,400,400i,500,500i,700,700i,900,900i&display=swap"
          rel="stylesheet">

    <!-- Stylesheets -->
    <link href="{% static 'assets/css/font-awesome-all.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/flaticon.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/owl.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/bootstrap.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/jquery.fancybox.min.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/animate.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/imagebg.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/color/theme-color.css' %}" id="jssDefault" rel="stylesheet">
    <link href="{% static 'assets/css/switcher-style.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/rtl.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/style.css' %}" rel="stylesheet">
    <link href="{% static 'assets/css/responsive.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.4/css/dataTables.dataTables.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/buttons/2.3.4/css/buttons.dataTables.min.css"/>


    <!--    &lt;!&ndash; Bootstrap css &ndash;&gt;-->
    <!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' %}" rel="stylesheet">-->
    {% block css %}
    {% endblock css %}
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KKDE51VTW6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-M56HMJEL3D');
    </script>
</head>
<!-- page wrapper -->
<body class="boxed_wrapper ltr">

{% include "nav.html" %}

{% block content %}
{% endblock content %}


<!-- jequery plugins -->
<script src="{% static 'assets/js/jquery.js' %}"></script>
<script src="{% static 'assets/js/bootstrap.min.js' %}"></script>
<script src="{% static 'assets/js/owl.js' %}"></script>
<script src="{% static 'assets/js/wow.js' %}"></script>
<script src="{% static 'assets/js/validation.js' %}"></script>
<script src="{% static 'assets/js/jquery.fancybox.js' %}"></script>
<script src="{% static 'assets/js/appear.js' %}"></script>
<script src="{% static 'assets/js/scrollbar.js' %}"></script>
<script src="{% static 'assets/js/tilt.jquery.js' %}"></script>
<script src="{% static 'assets/js/jQuery.style.switcher.min.js' %}"></script>
<script src="{% static 'assets/js/plugins.js' %}"></script>
<script src="{% static 'assets/js/text_animation.js' %}"></script>
<!-- Bootstrap Bundle with Popper (for modal, dropdowns, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-..."
        crossorigin="anonymous"></script>
<!-- DataTables and CSV export functionality -->
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.3.4/js/dataTables.js"></script>
<!-- DataTables Buttons JS -->
<script type="text/javascript" charset="utf-8" src="https://cdn.datatables.net/buttons/2.3.4/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" charset="utf-8" src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script type="text/javascript" charset="utf-8" src="https://cdn.datatables.net/buttons/2.3.4/js/buttons.html5.min.js"></script>
<script type="text/javascript" charset="utf-8" src="https://cdn.datatables.net/buttons/2.3.4/js/buttons.print.min.js"></script>
<script>
    $(document).ready(function () {
        var table = $('#sentencesTable').DataTable({
            "paging": true,  // Enable pagination
            "searching": true,  // Enable search functionality
            "ordering": true,  // Enable column sorting
            "autoWidth": false,  // Disable automatic width calculation
            "info": false,  // Disable info display (i.e., "Showing 1 to 10 of 50 entries")
            "dom": 'Bfrtip', // Position buttons above the table
            "buttons": [
                {
                    "extend": 'excel', // Excel export button
                    "text": 'Excel'
                },
            ]
        });
    });
</script>




<!-- main-js -->
<script src="{% static 'assets/js/script.js' %}"></script>
</body>
</html>
